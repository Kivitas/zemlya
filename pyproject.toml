[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zemlya"
version = "0.1.0"
description = "Zemlya: a JEPA-style latent decision & prediction architecture for small (<500M) models"
license = { text = "MIT" }
authors = [{ name = "kivitas" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["zemlya*"]
